<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f5f4ef">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <title>Sketch VR</title>
    <style>
      :root {
        --bg: #f5f4ef;
        --surface: #ffffff;
        --ink: #161614;
        --ink-2: #4b4b46;
        --muted: #8b8a82;
        --line: rgba(22, 22, 20, .1);
        --danger: #b42318;
        --radius: 12px;
        --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 10px 30px rgba(0, 0, 0, .07);
        --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
        --mono: ui-monospace, "SF Mono", Menlo, monospace;
      }

      *, *::before, *::after { box-sizing: border-box; }
      [hidden] { display: none !important; }

      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--ink);
      }

      body {
        display: flex;
        flex-direction: column;
        font: 14px/1.4 var(--font);
        -webkit-font-smoothing: antialiased;
      }

      button, input, label { font: inherit; }
      button:focus-visible, label:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

      .app-bar {
        z-index: 5;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
        min-height: 60px;
        padding: 12px 20px;
        border-bottom: 1px solid var(--line);
        background: var(--bg);
      }

      .app-title {
        margin: 0 auto 0 0;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: -.01em;
      }

      .image-upload-input {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }

      .toolbar-button, .upload-button {
        display: inline-flex;
        min-height: 34px;
        align-items: center;
        justify-content: center;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
        font-size: 13px;
        font-weight: 500;
        transition: border-color .15s ease, background .15s ease;
      }

      .toolbar-button:hover, .upload-button:hover { border-color: var(--ink-2); }
      .toolbar-button:disabled { opacity: .5; cursor: default; }

      .toolbar-button.is-primary {
        border-color: var(--ink);
        background: var(--ink);
        color: #fff;
      }

      .toolbar-button.is-primary:hover:not(:disabled) { background: var(--ink-2); border-color: var(--ink-2); }

      .app-status {
        display: flex;
        flex-wrap: wrap;
        gap: 2px 12px;
        color: var(--muted);
        font-size: 12px;
      }

      .app-status #statusText { color: var(--ink); font-weight: 500; }

      .stage {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        isolation: isolate;
        background: #e8e7e1;
      }

      .camera-feed {
        position: absolute;
        z-index: -1;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        background: #000;
        transition: opacity .3s ease;
      }

      .stage.is-live .camera-feed { opacity: 1; }

      .sketch-overlay {
        position: absolute;
        z-index: 1;
        top: 50%;
        left: 50%;
        width: min(55vw, 560px);
        max-height: 64vh;
        object-fit: contain;
        opacity: .5;
        cursor: grab;
        touch-action: none;
        transform: translate(-50%, -50%) scale(var(--sketch-scale, 1));
      }

      .sketch-overlay:not([src]) { display: none; }
      .sketch-overlay.is-dragging { cursor: grabbing; }

      .empty-state {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        padding: 24px;
        text-align: center;
        pointer-events: none;
      }

      .empty-state strong {
        display: block;
        margin-bottom: 6px;
        font-size: 18px;
        font-weight: 600;
      }

      .empty-steps {
        display: inline-grid;
        gap: 6px;
        margin: 0;
        padding: 0;
        color: var(--ink-2);
        text-align: left;
        list-style: decimal inside;
      }

      .panel-help {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .stage:not(.is-live):not(:has(.sketch-overlay[src])) .empty-state { display: grid; }

      .sketch-controls {
        position: absolute;
        z-index: 3;
        top: 16px;
        right: 16px;
        display: none;
        width: 240px;
        gap: 12px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: rgba(255, 255, 255, .92);
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
      }

      .stage.is-live .sketch-controls { display: grid; }
      body.xr-active .sketch-controls { display: none; }

      .sketch-control {
        display: grid;
        grid-template-columns: 56px minmax(0, 1fr) 44px;
        align-items: center;
        gap: 8px;
        color: var(--ink-2);
        font-size: 12px;
      }

      .sketch-control input {
        width: 100%;
        min-width: 0;
        height: 30px;
        padding: 0 8px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
        font-size: 12px;
      }

      .sketch-control output {
        color: var(--ink);
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .fix-sketch-button {
        min-height: 34px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        color: var(--ink);
        cursor: pointer;
        font-size: 12px;
        font-weight: 500;
      }

      .fix-sketch-button[aria-pressed="true"] {
        border-color: var(--ink);
        background: var(--ink);
        color: #fff;
      }

      body.xr-active .fix-sketch-button { display: none; }

      body.xr-active .stage { pointer-events: none; }

      .xr-renderer {
        position: fixed;
        z-index: 10;
        inset: 0;
        display: none;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }

      body.xr-active .xr-renderer { display: block; }

      .xr-hud {
        position: fixed;
        z-index: 20;
        inset: 0;
        display: none;
        pointer-events: none;
      }

      body.xr-active .xr-hud { display: block; }

      .xr-hud .sketch-controls {
        top: max(20px, env(safe-area-inset-top));
        right: 16px;
        bottom: auto;
      }

      .xr-placement-controls {
        position: absolute;
        bottom: max(30px, env(safe-area-inset-bottom));
        left: 50%;
        transform: translateX(-50%);
      }

      .xr-placement-hint {
        margin: 0;
        padding: 9px 16px;
        border-radius: 999px;
        background: rgba(22, 22, 20, .86);
        color: #fff;
        font-size: 13px;
        white-space: nowrap;
      }

      .error-message {
        min-height: 0;
        margin: 0;
        padding: 10px 20px;
        background: var(--bg);
        color: var(--danger);
        font-size: 13px;
      }

      .error-message:empty { display: none; }

      body.xr-active .app-bar { display: none; }

      @media (max-width: 600px) {
        .app-bar { padding: 12px 14px; }
        .app-title { width: 100%; }
        .sketch-overlay { width: min(72vw, 360px); max-height: 70vh; }
        .sketch-controls { top: auto; right: 12px; bottom: 12px; left: 12px; width: auto; }
      }
    </style>
  </head>
  <body>
    <header class="app-bar">
      <h1 class="app-title">Sketch VR</h1>
      <input class="image-upload-input" id="imageUpload" type="file" accept="image/*" aria-label="Choose a sketch image">
      <label class="upload-button" for="imageUpload">Choose sketch</label>
      <button class="toolbar-button is-primary" id="startButton" type="button"><span>Start camera</span></button>
      <button class="toolbar-button is-primary" id="xrButton" type="button" hidden>Enter headset VR</button>
      <button class="toolbar-button" id="flipButton" type="button" hidden>Switch camera</button>
      <button class="toolbar-button" id="stopButton" type="button" hidden>Stop camera</button>
      <div class="app-status">
        <span id="statusText" aria-live="polite">Camera off</span>
        <span id="bottomNote">Waiting for camera</span>
      </div>
    </header>

    <main class="stage" id="stage">
      <video class="camera-feed" id="cameraFeed" autoplay muted playsinline aria-label="Live camera view"></video>
      <img class="sketch-overlay" alt="Sketch reference" draggable="false">
      <div class="empty-state">
        <div>
          <strong>Trace a sketch on your space</strong>
          <ol class="empty-steps">
            <li>Choose a sketch image.</li>
            <li>Start the camera.</li>
            <li>Drag it into place and lock it.</li>
          </ol>
        </div>
      </div>
      <div class="sketch-controls" id="sketchControls" aria-label="Sketch adjustments">
        <label class="sketch-control" for="sketchSize">
          <span>Size</span>
          <input id="sketchSize" type="number" step="any" value="100" aria-label="Sketch size">
          <output id="sketchSizeValue" for="sketchSize">100%</output>
        </label>
        <label class="sketch-control" for="sketchOpacity">
          <span>Opacity</span>
          <input id="sketchOpacity" type="number" step="any" value="50" aria-label="Sketch opacity">
          <output id="sketchOpacityValue" for="sketchOpacity">50%</output>
        </label>
        <button class="fix-sketch-button" id="fixSketchButton" type="button" aria-pressed="false">Fix in place</button>
        <p class="panel-help">Drag the sketch or use the arrow keys to move it. Fix it to keep it still.</p>
      </div>
    </main>
    <p class="error-message" id="errorMessage" role="status"></p>
    <div class="xr-hud" id="xrHud">
      <div class="xr-placement-controls">
        <p class="xr-placement-hint" id="xrPlacementHint">Aim at a wall and pull the trigger to pin the sketch</p>
      </div>
    </div>

    <script>
      const stage = document.querySelector("#stage");
      const video = document.querySelector("#cameraFeed");
      const statusText = document.querySelector("#statusText");
      const bottomNote = document.querySelector("#bottomNote");
      const errorMessage = document.querySelector("#errorMessage");
      const startButton = document.querySelector("#startButton");
      const xrButton = document.querySelector("#xrButton");
      const flipButton = document.querySelector("#flipButton");
      const stopButton = document.querySelector("#stopButton");
      const imageUpload = document.querySelector("#imageUpload");
      const sketch = document.querySelector(".sketch-overlay");
      const sketchControls = document.querySelector("#sketchControls");
      const sketchSize = document.querySelector("#sketchSize");
      const sketchOpacity = document.querySelector("#sketchOpacity");
      const sketchSizeValue = document.querySelector("#sketchSizeValue");
      const sketchOpacityValue = document.querySelector("#sketchOpacityValue");
      const fixSketchButton = document.querySelector("#fixSketchButton");
      let stream = null;
      let uploadedImageUrl = null;
      let facingMode = "environment";
      let isSketchFixed = false;

      function setSketchPosition(centerX, centerY) {
        const stageBounds = stage.getBoundingClientRect();
        const sketchBounds = sketch.getBoundingClientRect();
        const halfWidth = sketchBounds.width / 2;
        const halfHeight = sketchBounds.height / 2;
        const x = Math.max(halfWidth, Math.min(stageBounds.width - halfWidth, centerX));
        const y = Math.max(halfHeight, Math.min(stageBounds.height - halfHeight, centerY));
        sketch.style.left = `${(x / stageBounds.width) * 100}%`;
        sketch.style.top = `${(y / stageBounds.height) * 100}%`;
      }

      function updateSketchAdjustments() {
        const size = Number(sketchSize.value);
        const opacity = Number(sketchOpacity.value);
        sketch.style.setProperty("--sketch-scale", size / 100);
        sketch.style.opacity = opacity / 100;
        sketchSizeValue.value = `${size}%`;
        sketchOpacityValue.value = `${opacity}%`;
        const stageBounds = stage.getBoundingClientRect();
        const sketchBounds = sketch.getBoundingClientRect();
        setSketchPosition(
          sketchBounds.left - stageBounds.left + sketchBounds.width / 2,
          sketchBounds.top - stageBounds.top + sketchBounds.height / 2
        );
        document.dispatchEvent(new CustomEvent("sketchadjust", { detail: { size: size / 100, opacity: opacity / 100 } }));
      }

      sketchSize.addEventListener("input", updateSketchAdjustments);
      sketchOpacity.addEventListener("input", updateSketchAdjustments);
      sketch.addEventListener("load", updateSketchAdjustments);
      window.addEventListener("resize", updateSketchAdjustments);
      updateSketchAdjustments();

      imageUpload.addEventListener("change", () => {
        const image = imageUpload.files?.[0];
        imageUpload.value = "";
        if (!image) return;
        if (!image.type.startsWith("image/")) {
          errorMessage.textContent = "That file isn't an image. Choose a JPG or PNG.";
          return;
        }

        const nextImageUrl = URL.createObjectURL(image);
        sketch.addEventListener("load", () => {
          if (uploadedImageUrl) URL.revokeObjectURL(uploadedImageUrl);
          uploadedImageUrl = nextImageUrl;
          bottomNote.textContent = image.name;
          errorMessage.textContent = "";
          document.dispatchEvent(new Event("sketchimagechange"));
        }, { once: true });
        sketch.addEventListener("error", () => {
          URL.revokeObjectURL(nextImageUrl);
          errorMessage.textContent = `Could not load ${image.name}. Choose a different image.`;
        }, { once: true });
        sketch.src = nextImageUrl;
      });

      window.addEventListener("beforeunload", () => {
        if (uploadedImageUrl) URL.revokeObjectURL(uploadedImageUrl);
      });

      fixSketchButton.addEventListener("click", () => {
        isSketchFixed = !isSketchFixed;
        fixSketchButton.setAttribute("aria-pressed", String(isSketchFixed));
        fixSketchButton.textContent = isSketchFixed ? "Move sketch" : "Fix in place";
        sketch.classList.toggle("is-fixed", isSketchFixed);
        bottomNote.textContent = isSketchFixed ? "Locked to camera view only" : "Camera connected";
      });

      stage.addEventListener("pointerdown", (event) => {
        if (isSketchFixed || event.target.closest("button, input, label, select, textarea, a, [role='button'], .topbar, .bottombar, .side-readout")) return;
        const sketchBounds = sketch.getBoundingClientRect();
        if (
          event.clientX < sketchBounds.left || event.clientX > sketchBounds.right ||
          event.clientY < sketchBounds.top || event.clientY > sketchBounds.bottom
        ) return;
        event.preventDefault();
        stage.setPointerCapture(event.pointerId);
        sketch.classList.add("is-dragging");
        sketch.dataset.dragOffsetX = event.clientX - sketchBounds.left - sketchBounds.width / 2;
        sketch.dataset.dragOffsetY = event.clientY - sketchBounds.top - sketchBounds.height / 2;
      });

      stage.addEventListener("pointermove", (event) => {
        if (!stage.hasPointerCapture(event.pointerId)) return;
        const bounds = stage.getBoundingClientRect();
        const centerX = event.clientX - Number(sketch.dataset.dragOffsetX);
        const centerY = event.clientY - Number(sketch.dataset.dragOffsetY);
        setSketchPosition(centerX - bounds.left, centerY - bounds.top);
      });

      function finishSketchDrag(event) {
        if (stage.hasPointerCapture(event.pointerId)) stage.releasePointerCapture(event.pointerId);
        sketch.classList.remove("is-dragging");
      }

      stage.addEventListener("pointerup", finishSketchDrag);
      stage.addEventListener("pointercancel", finishSketchDrag);

      function moveSketchBy(moveX, moveY) {
        const stageBounds = stage.getBoundingClientRect();
        const sketchBounds = sketch.getBoundingClientRect();
        const centerX = sketchBounds.left - stageBounds.left + sketchBounds.width / 2;
        const centerY = sketchBounds.top - stageBounds.top + sketchBounds.height / 2;
        setSketchPosition(centerX + moveX * 24, centerY + moveY * 24);
        document.dispatchEvent(new CustomEvent("sketchmove", { detail: { x: moveX, y: moveY } }));
      }

      document.addEventListener("keydown", (event) => {
        if (!stage.classList.contains("is-live") || document.body.classList.contains("xr-active")) return;
        if (event.target.closest("input, textarea, select, [contenteditable='true']")) return;
        const directions = {
          ArrowLeft: [-1, 0],
          ArrowRight: [1, 0],
          ArrowUp: [0, -1],
          ArrowDown: [0, 1]
        };
        const direction = directions[event.key];
        if (!direction) return;
        event.preventDefault();
        moveSketchBy(direction[0], direction[1]);
      });

      function stopStream() {
        if (stream) stream.getTracks().forEach((track) => track.stop());
        stream = null;
        video.srcObject = null;
        stage.classList.remove("is-live");
        statusText.textContent = "Camera off";
        bottomNote.textContent = "Waiting for camera";
        flipButton.hidden = true;
        stopButton.hidden = true;
        startButton.querySelector("span").textContent = "Start camera";
      }

      document.addEventListener("xr-camera-stop", stopStream);

      async function startStream() {
        errorMessage.textContent = "";
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          errorMessage.textContent = "The camera needs a secure (https) page. Open the Sketch VR link, not a local file.";
          return;
        }

        statusText.textContent = "Requesting access";
        bottomNote.textContent = "Waiting for permission";
        startButton.disabled = true;

        try {
          const nextStream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              facingMode: { ideal: facingMode },
              width: { ideal: 1920 },
              height: { ideal: 1080 }
            }
          });
          if (stream) stream.getTracks().forEach((track) => track.stop());
          stream = nextStream;
          video.srcObject = stream;
          await video.play();
          stage.classList.add("is-live");
          statusText.textContent = "Live view";
          bottomNote.textContent = "Camera connected";
          flipButton.hidden = false;
          stopButton.hidden = false;
          startButton.querySelector("span").textContent = "Camera live";
        } catch (error) {
          statusText.textContent = "Camera off";
          bottomNote.textContent = "Waiting for camera";
          const messages = {
            NotAllowedError: "Camera access is blocked. Allow the camera for this site in your browser settings, then press Start camera again.",
            NotFoundError: "No camera was found on this device.",
            NotReadableError: "Another app is using the camera. Close it and try again."
          };
          errorMessage.textContent = messages[error.name] || "The camera could not start. Check your device and try again.";
          if (stream) stream.getTracks().forEach((track) => track.stop());
          stream = null;
          video.srcObject = null;
        } finally {
          startButton.disabled = false;
        }
      }

      startButton.addEventListener("click", () => {
        if (stream) return;
        startStream();
      });

      flipButton.addEventListener("click", async () => {
        if (!stream) return;
        facingMode = facingMode === "environment" ? "user" : "environment";
        stopStream();
        await startStream();
      });

      stopButton.addEventListener("click", stopStream);
      video.addEventListener("ended", stopStream);
    </script>
    <script type="module">
      const xrButton = document.querySelector("#xrButton");
      const statusText = document.querySelector("#statusText");
      const bottomNote = document.querySelector("#bottomNote");
      const errorMessage = document.querySelector("#errorMessage");
      const cameraFeed = document.querySelector("#cameraFeed");
      const flipButton = document.querySelector("#flipButton");
      const stopButton = document.querySelector("#stopButton");
      const xrHud = document.querySelector("#xrHud");
      const xrPlacementHint = document.querySelector("#xrPlacementHint");
      const sketchControls = document.querySelector("#sketchControls");

      if (!window.isSecureContext) {
        errorMessage.textContent = "Headset mode needs a secure (https) page. Open the Sketch VR link to use it.";
      } else if (!navigator.xr) {
        errorMessage.textContent = "Headset mode isn't available in this browser. Open the page in the Meta Quest Browser, or turn on the Immersive Web Emulator to test.";
      } else {
        try {
          const arSupported = await navigator.xr.isSessionSupported("immersive-ar");
          const vrSupported = await navigator.xr.isSessionSupported("immersive-vr");
          if (!arSupported && !vrSupported) {
            errorMessage.textContent = "Headset mode isn't available here. Use the Meta Quest Browser, or turn on the Immersive Web Emulator to test.";
          } else {
            const xrSessionMode = arSupported ? "immersive-ar" : "immersive-vr";
            xrButton.textContent = arSupported ? "Enter headset AR" : "Test in VR emulator";
            const THREE = await import("https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js");
            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.xr.enabled = true;
            renderer.xr.setReferenceSpaceType("local");
            renderer.setClearColor(0x000000, 0);
            renderer.domElement.className = "xr-renderer";
            renderer.domElement.setAttribute("aria-hidden", "true");
            document.body.appendChild(renderer.domElement);

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(70, 1, 0.01, 20);
            scene.add(camera);

            const controllerRecords = [];
            for (let index = 0; index < 2; index += 1) {
              const controller = renderer.xr.getController(index);
              const rayGeometry = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(0, 0, -0.04),
                new THREE.Vector3(0, 0, -1.5)
              ]);
              const ray = new THREE.Line(
                rayGeometry,
                new THREE.LineBasicMaterial({ color: 0xd4f36a, transparent: true, opacity: 0.8 })
              );
              ray.visible = false;
              controller.add(ray);
              const record = { controller, inputSource: null, ray };
              controllerRecords.push(record);
              scene.add(controller);
              controller.addEventListener("connected", (event) => {
                ray.visible = Boolean(event.data.gamepad);
                record.inputSource = event.data;
              });
              controller.addEventListener("disconnected", () => {
                ray.visible = false;
                record.inputSource = null;
              });
            }
            const placement = new THREE.Group();
            placement.matrixAutoUpdate = false;
            scene.add(placement);

            const sketch = document.querySelector(".sketch-overlay");
            if (!sketch.getAttribute("src")) {
              bottomNote.textContent = "Choose a sketch to enable headset mode";
              await new Promise((resolve) => document.addEventListener("sketchimagechange", resolve, { once: true }));
            }
            await sketch.decode();
            const texture = new THREE.Texture(sketch);
            texture.colorSpace = THREE.SRGBColorSpace;
            texture.needsUpdate = true;

            const aspect = sketch.naturalWidth / sketch.naturalHeight;
            const width = Math.min(0.65, 0.65 * aspect);
            const height = width / aspect;
            const material = new THREE.MeshBasicMaterial({
              map: texture,
              transparent: true,
              opacity: 0.5,
              depthTest: false,
              depthWrite: false,
              side: THREE.DoubleSide
            });
            const overlay = new THREE.Mesh(new THREE.PlaneGeometry(width, height), material);
            overlay.position.z = 0.012;
            placement.add(overlay);


            const xrControlCanvas = document.createElement("canvas");
            xrControlCanvas.width = 420;
            xrControlCanvas.height = 360;
            const xrControlContext = xrControlCanvas.getContext("2d");
            const xrControlTexture = new THREE.CanvasTexture(xrControlCanvas);
            xrControlTexture.colorSpace = THREE.SRGBColorSpace;
            const xrControlPanel = new THREE.Mesh(
              new THREE.PlaneGeometry(0.32, 0.275),
              new THREE.MeshBasicMaterial({ map: xrControlTexture, transparent: true, depthTest: false, depthWrite: false })
            );
            xrControlPanel.position.set(0.2, -0.1, -0.58);
            xrControlPanel.renderOrder = 20;
            camera.add(xrControlPanel);

            // Guide card on the right side of the view, opened by the HELP tab (separate from the menu).
            const helpCanvas = document.createElement("canvas");
            helpCanvas.width = 420;
            helpCanvas.height = 720;
            const helpContext = helpCanvas.getContext("2d");
            helpContext.fillStyle = "rgba(22, 22, 20, 0.94)";
            helpContext.fillRect(0, 0, 420, 720);
            helpContext.textAlign = "left";
            helpContext.textBaseline = "top";
            // Each entry: a heading (h) or a line of text (t). Long lines wrap automatically.
            const helpEntries = [
              { h: "Place your sketch" },
              { t: "Point the controller at the table or wall, like a laser pointer. You don't need to turn your head." },
              { t: "Press A (right hand) or X (left hand) to lock it. Press again to unlock." },
              { h: "Closer or farther" },
              { t: "Before locking: hold the side button and push the stick up to move it closer, or down to move it farther." },
              { t: "After locking: hold the side button and push up or down to move it nearer or farther." },
              { h: "Slide it" },
              { t: "After locking: hold the side button and push the stick left or right." },
              { h: "The menu" },
              { t: "Push the stick to move the menu. Or hold the side button on an empty part of it and drag." },
              { t: "Press HIDE to hide it. To bring it back, aim at MENU and pull the trigger, or press B (right) or Y (left)." },
              { h: "Good to know" },
              { t: "Your hands and your pen never move the drawing." }
            ];
            function wrapText(text, x, y, maxWidth, lineHeight) {
              const words = text.split(" ");
              let line = "";
              for (const word of words) {
                const test = line ? `${line} ${word}` : word;
                if (helpContext.measureText(test).width > maxWidth && line) {
                  helpContext.fillText(line, x, y);
                  line = word;
                  y += lineHeight;
                } else {
                  line = test;
                }
              }
              if (line) helpContext.fillText(line, x, y);
              return y + lineHeight;
            }
            let helpY = 16;
            helpContext.fillStyle = "#d4f36a";
            helpContext.font = "600 24px sans-serif";
            helpContext.fillText("How to use Sketch VR", 16, helpY);
            helpY += 44;
            for (const entry of helpEntries) {
              if (entry.h) {
                helpY += 6;
                helpContext.fillStyle = "#d4f36a";
                helpContext.font = "600 20px sans-serif";
                helpContext.fillText(entry.h, 16, helpY);
                helpY += 30;
              } else {
                helpContext.fillStyle = "#ffffff";
                helpContext.font = "18px sans-serif";
                helpY = wrapText(entry.t, 16, helpY, 388, 24);
              }
            }
            const helpTexture = new THREE.CanvasTexture(helpCanvas);
            helpTexture.colorSpace = THREE.SRGBColorSpace;
            const helpCard = new THREE.Mesh(
              new THREE.PlaneGeometry(0.3, 0.514),
              new THREE.MeshBasicMaterial({ map: helpTexture, transparent: true, depthTest: false, depthWrite: false })
            );
            helpCard.position.set(0.3, -0.18, -0.5);
            helpCard.renderOrder = 20;
            helpCard.name = "helpCard";
            helpCard.visible = false;
            camera.add(helpCard);

            // HELP tab on the right side of the view: always visible, opens and closes the guide card.
            const helpTabCanvas = document.createElement("canvas");
            helpTabCanvas.width = 256;
            helpTabCanvas.height = 96;
            const helpTabContext = helpTabCanvas.getContext("2d");
            helpTabContext.fillStyle = "rgba(16, 19, 17, 0.92)";
            helpTabContext.fillRect(2, 2, 252, 92);
            helpTabContext.strokeStyle = "#d4f36a";
            helpTabContext.lineWidth = 4;
            helpTabContext.strokeRect(4, 4, 248, 88);
            helpTabContext.fillStyle = "#d4f36a";
            helpTabContext.font = "600 44px sans-serif";
            helpTabContext.textAlign = "center";
            helpTabContext.textBaseline = "middle";
            helpTabContext.fillText("HELP", 128, 48);
            const helpTabTexture = new THREE.CanvasTexture(helpTabCanvas);
            helpTabTexture.colorSpace = THREE.SRGBColorSpace;
            const helpTab = new THREE.Mesh(
              new THREE.PlaneGeometry(0.12, 0.045),
              new THREE.MeshBasicMaterial({ map: helpTabTexture, transparent: true, depthTest: false, depthWrite: false })
            );
            helpTab.name = "helpTab";
            helpTab.position.set(0.3, 0.14, -0.5);
            helpTab.renderOrder = 21;
            camera.add(helpTab);

            // Small MENU tab, shown only while the menu is hidden: aim at it and pull the trigger.
            const menuTabCanvas = document.createElement("canvas");
            menuTabCanvas.width = 256;
            menuTabCanvas.height = 96;
            const menuTabContext = menuTabCanvas.getContext("2d");
            menuTabContext.fillStyle = "rgba(16, 19, 17, 0.92)";
            menuTabContext.fillRect(2, 2, 252, 92);
            menuTabContext.strokeStyle = "#d4f36a";
            menuTabContext.lineWidth = 4;
            menuTabContext.strokeRect(4, 4, 248, 88);
            menuTabContext.fillStyle = "#d4f36a";
            menuTabContext.font = "600 44px sans-serif";
            menuTabContext.textAlign = "center";
            menuTabContext.textBaseline = "middle";
            menuTabContext.fillText("MENU", 128, 48);
            const menuTabTexture = new THREE.CanvasTexture(menuTabCanvas);
            menuTabTexture.colorSpace = THREE.SRGBColorSpace;
            const menuTab = new THREE.Mesh(
              new THREE.PlaneGeometry(0.12, 0.045),
              new THREE.MeshBasicMaterial({ map: menuTabTexture, transparent: true, depthTest: false, depthWrite: false })
            );
            menuTab.name = "menuTab";
            menuTab.position.set(0.2, -0.22, -0.5);
            menuTab.renderOrder = 21;
            menuTab.visible = false;
            camera.add(menuTab);

            // Layout (420 x 360 px): three sections of 120 px. Each has a label band, then two buttons.
            const xrControlTargets = [
              { id: "opacity-down", x: 12, y: 44, width: 188, height: 72, label: "−" },
              { id: "opacity-up", x: 220, y: 44, width: 188, height: 72, label: "+" },
              { id: "size-down", x: 12, y: 164, width: 188, height: 72, label: "−" },
              { id: "size-up", x: 220, y: 164, width: 188, height: 72, label: "+" },
              { id: "depth-near", x: 12, y: 284, width: 188, height: 72, label: "NEARER" },
              { id: "depth-far", x: 220, y: 284, width: 188, height: 72, label: "FARTHER" },
              { id: "hide", x: 312, y: 6, width: 96, height: 32, label: "HIDE" }
            ];
            let hoveredXRControl = null;

            function drawXRControlPanel() {
              xrControlContext.clearRect(0, 0, xrControlCanvas.width, xrControlCanvas.height);
              xrControlContext.fillStyle = "rgba(22, 22, 20, 0.88)";
              xrControlContext.fillRect(0, 0, xrControlCanvas.width, xrControlCanvas.height);
              xrControlContext.textAlign = "center";
              xrControlContext.textBaseline = "middle";
              const opacity = document.querySelector("#sketchOpacity").value;
              const size = document.querySelector("#sketchSize").value;
              xrControlContext.fillStyle = "#ffffff";
              xrControlContext.font = "600 22px sans-serif";
              xrControlContext.fillText(`OPACITY ${opacity}%`, 210, 18);
              xrControlContext.fillText(`SIZE ${size}%`, 210, 138);
              xrControlContext.fillText("DISTANCE", 210, 258);

              for (const target of xrControlTargets) {
                const active = target.id === hoveredXRControl;
                xrControlContext.strokeStyle = active ? "#d4f36a" : "rgba(255, 255, 255, 0.35)";
                xrControlContext.lineWidth = 3;
                xrControlContext.strokeRect(target.x + 1.5, target.y + 1.5, target.width - 3, target.height - 3);
                xrControlContext.fillStyle = active ? "#d4f36a" : "#ffffff";
                xrControlContext.font = target.id.endsWith("-down") || target.id.endsWith("-up")
                  ? "600 56px sans-serif"
                  : target.id === "hide"
                    ? "600 18px sans-serif"
                    : "600 22px sans-serif";
                xrControlContext.fillText(target.label, target.x + target.width / 2, target.y + target.height / 2);
              }
              xrControlTexture.needsUpdate = true;
            }

            function setPanelHidden(hidden) {
              panelHidden = hidden;
              xrControlPanel.visible = !hidden;
              menuTab.visible = hidden;
              hoveredXRControl = null;
              if (hidden) panelDrag = null;
            }

            function activateXRControl(id) {
              if (id === "hide") {
                setPanelHidden(true);
                return;
              }
              if (id.startsWith("depth-")) {
                moveSketchDepth(id === "depth-near" ? 1 : -1);
                return;
              }

              const input = document.querySelector(id.startsWith("size-") ? "#sketchSize" : "#sketchOpacity");
              const step = id.endsWith("up") ? 10 : -10;
              input.value = String(Number(input.value) + step);
              input.dispatchEvent(new Event("input", { bubbles: true }));
            }

            drawXRControlPanel();
            document.addEventListener("sketchadjust", drawXRControlPanel);

            document.addEventListener("sketchadjust", (event) => {
              overlay.scale.set(event.detail.size, event.detail.size, 1);
              material.opacity = Math.max(0, Math.min(1, event.detail.opacity));
            });
            document.addEventListener("sketchimagechange", () => {
              texture.needsUpdate = true;
              const aspect = sketch.naturalWidth / sketch.naturalHeight;
              const width = Math.min(0.65, 0.65 * aspect);
              overlay.geometry.dispose();
              overlay.geometry = new THREE.PlaneGeometry(width, width / aspect);
            });
            document.addEventListener("sketchmove", (event) => {
              overlay.position.x += event.detail.x * 0.04;
              overlay.position.y -= event.detail.y * 0.04;
            });

            const reticle = new THREE.Mesh(
              new THREE.RingGeometry(0.035, 0.045, 32),
              new THREE.MeshBasicMaterial({ color: 0xd4f36a, side: THREE.DoubleSide })
            );
            reticle.position.z = 0.02;
            placement.add(reticle);

            let placementAnchor = null;
            let isFixed = false;
            let hasBeenPlaced = false;
            let anchorGeneration = 0;
            let placementRequested = false;
            const viewerPosition = new THREE.Vector3();
            const viewerQuaternion = new THREE.Quaternion();
            const viewerScale = new THREE.Vector3();
            const rayDirection = new THREE.Vector3();
            const planeMatrix = new THREE.Matrix4();
            const inversePlaneMatrix = new THREE.Matrix4();
            const localRayOrigin = new THREE.Vector3();
            const localRayDirection = new THREE.Vector3();
            const localHitPoint = new THREE.Vector3();
            const hitWorldPoint = new THREE.Vector3();
            const previewOffset = new THREE.Matrix4().makeTranslation(0, 0, -1.4);
            const previewMatrix = new THREE.Matrix4();
            const headMatrix = new THREE.Matrix4();
            let activeAimRecord = null;
            const previousButtonStates = new Map();
            const triggerButtonIndex = 0;
            // Standard XR gamepad index 4: A on the right controller, X on the left.
            const faceButtonIndex = 4;
            // Standard XR gamepad index 1: the grip (squeeze) button on either controller.
            const gripButtonIndex = 1;
            const previousFaceStates = new Map();
            const controllerRaycaster = new THREE.Raycaster();
            const controllerPosition = new THREE.Vector3();
            const controllerQuaternion = new THREE.Quaternion();
            const controllerDirection = new THREE.Vector3();
            const joystickMoveSpeed = 1;
            const depthStepPerPress = 0.005;
            const depthSpeed = 0.12;
            let previousFrameTime = null;

            function setControllerRay(controller) {
              controller.updateMatrixWorld(true);
              controllerPosition.setFromMatrixPosition(controller.matrixWorld);
              controllerQuaternion.setFromRotationMatrix(controller.matrixWorld);
              controllerDirection.set(0, 0, -1).applyQuaternion(controllerQuaternion).normalize();
              controllerRaycaster.set(controllerPosition, controllerDirection);
            }

            function findXRControl(intersection) {
              if (!intersection?.uv) return null;
              const x = intersection.uv.x * xrControlCanvas.width;
              const y = (1 - intersection.uv.y) * xrControlCanvas.height;
              return xrControlTargets.find((target) =>
                x >= target.x && x <= target.x + target.width &&
                y >= target.y && y <= target.y + target.height
              ) || null;
            }

            // Floating panel: it starts on your head, and stays in the room once you move it.
            const panelPlane = new THREE.Plane();
            const panelHitPoint = new THREE.Vector3();
            const panelMoveSpeed = 0.5;
            // How far in front of the controller the sketch goes when no surface is hit (adjust with grip + stick).
            let aimDistance = 0.6;
            const aimDistanceSpeed = 0.8;
            const aimOffset = new THREE.Matrix4();
            let panelDrag = null;
            let panelHidden = false;
            const previousGripStates = new Map();
            const previousMenuStates = new Map();
            const menuButtonIndex = 5; // B (right) or Y (left): shows or hides the menu.

            // Moves the panel out of the head so it stays put in the room. Keeps its world position.
            function detachPanelToRoom() {
              if (xrControlPanel.parent !== scene) scene.attach(xrControlPanel);
            }

            // Turn the panel to face the viewer after it moves.
            function faceViewer() {
              xrControlPanel.lookAt(camera.getWorldPosition(new THREE.Vector3()));
            }

            // Where the controller ray meets the panel's front face, in world space.
            function panelDragPoint() {
              xrControlPanel.updateMatrixWorld(true);
              const normal = new THREE.Vector3(0, 0, 1).transformDirection(xrControlPanel.matrixWorld);
              const origin = xrControlPanel.getWorldPosition(new THREE.Vector3());
              panelPlane.setFromNormalAndCoplanarPoint(normal, origin);
              if (!controllerRaycaster.ray.intersectPlane(panelPlane, panelHitPoint)) return null;
              return panelHitPoint.clone();
            }

            function startPanelDrag(record) {
              detachPanelToRoom();
              const hit = panelDragPoint();
              if (!hit) return;
              panelDrag = { record, offset: xrControlPanel.getWorldPosition(new THREE.Vector3()).sub(hit) };
              xrPlacementHint.textContent = "Moving panel · release grip to drop it";
            }

            function updatePanelDrag() {
              const hit = panelDragPoint();
              if (!hit) return;
              xrControlPanel.position.copy(hit.add(panelDrag.offset));
              faceViewer();
            }

            // Thumbstick: left/right and up/down move the panel (when the sketch is not pinned).
            function moveFloatingPanel(movement, deltaSeconds) {
              detachPanelToRoom();
              camera.updateMatrixWorld(true);
              const right = new THREE.Vector3(1, 0, 0).transformDirection(camera.matrixWorld);
              const up = new THREE.Vector3(0, 1, 0).transformDirection(camera.matrixWorld);
              const step = panelMoveSpeed * deltaSeconds;
              xrControlPanel.position.addScaledVector(right, movement.x * step);
              xrControlPanel.position.addScaledVector(up, -movement.y * step); // stick up is negative
              faceViewer();
            }

            function applyJoystickDeadzone(value) {
              const magnitude = Math.abs(value);
              if (magnitude <= 0.18) return 0;
              return Math.sign(value) * ((magnitude - 0.18) / 0.82);
            }

            // Only a real hand-held controller's thumbstick may move a fixed sketch.
            // Hands, transient pointers and other gamepads are ignored, so a hand or
            // a pen in view can never slide the sketch.
            function isThumbstickController(inputSource) {
              return Boolean(inputSource.gamepad) &&
                !inputSource.hand &&
                inputSource.targetRayMode === "tracked-pointer" &&
                (inputSource.handedness === "left" || inputSource.handedness === "right");
            }

            // Quest thumbstick sits on axes[2] and axes[3] (axes[0] and axes[1] are unused).
            // Returns the strongest stick push, and whether that controller's grip is held.
            function getJoystickInput(session) {
              let movement = { x: 0, y: 0, grip: false };
              let strongestInput = 0;
              for (const inputSource of session.inputSources) {
                if (!isThumbstickController(inputSource)) continue;
                const axes = inputSource.gamepad.axes;
                const base = axes.length >= 4 ? 2 : 0;
                const x = applyJoystickDeadzone(axes[base] ?? 0);
                const y = applyJoystickDeadzone(axes[base + 1] ?? 0);
                const strength = Math.hypot(x, y);
                if (strength > strongestInput) {
                  movement = { x, y, grip: Boolean(inputSource.gamepad.buttons[gripButtonIndex]?.pressed) };
                  strongestInput = strength;
                }
              }
              if (strongestInput > 1) {
                movement.x /= strongestInput;
                movement.y /= strongestInput;
              }
              return movement;
            }

            function containsPoint(polygon, x, y) {
              let inside = false;
              for (let current = 0, previous = polygon.length - 1; current < polygon.length; previous = current++) {
                const a = polygon[current];
                const b = polygon[previous];
                if ((a.y > y) !== (b.y > y) && x < ((b.x - a.x) * (y - a.y)) / (b.y - a.y) + a.x) {
                  inside = !inside;
                }
              }
              return inside;
            }

            // Finds the nearest detected surface (wall, table...) along a ray from origin in direction.
            function findSurfaceTarget(frame, referenceSpace, origin, direction) {
              if (!frame.detectedPlanes) return null;
              viewerPosition.copy(origin);
              rayDirection.copy(direction).normalize();
              let nearestDistance = Infinity;
              let nearestMatrix = null;

              for (const plane of frame.detectedPlanes) {
                const planePose = frame.getPose(plane.planeSpace, referenceSpace);
                if (!planePose || !plane.polygon || plane.polygon.length < 3) continue;

                planeMatrix.fromArray(planePose.transform.matrix);
                inversePlaneMatrix.copy(planeMatrix).invert();
                localRayOrigin.copy(viewerPosition).applyMatrix4(inversePlaneMatrix);
                localRayDirection.copy(rayDirection).transformDirection(inversePlaneMatrix);
                if (Math.abs(localRayDirection.z) < 0.0001) continue;

                const distance = -localRayOrigin.z / localRayDirection.z;
                if (distance <= 0) continue;
                localHitPoint.copy(localRayOrigin).addScaledVector(localRayDirection, distance);
                if (!containsPoint(plane.polygon, localHitPoint.x, localHitPoint.y)) continue;

                hitWorldPoint.copy(localHitPoint).applyMatrix4(planeMatrix);
                const worldDistance = hitWorldPoint.distanceTo(viewerPosition);
                if (worldDistance >= nearestDistance) continue;

                nearestDistance = worldDistance;
                nearestMatrix = planeMatrix.clone().multiply(
                  new THREE.Matrix4().makeTranslation(localHitPoint.x, localHitPoint.y, 0)
                );
              }

              return nearestMatrix;
            }

            function togglePlacement() {
              if (isFixed) {
                isFixed = false;
                hasBeenPlaced = false;
                if (placementAnchor) placementAnchor.delete();
                placementAnchor = null;
                anchorGeneration += 1;
                overlay.position.x = 0;
                overlay.position.y = 0;
                hoveredXRControl = null;
                drawXRControlPanel();
                xrPlacementHint.textContent = "Aim at a wall and press A to pin it again";
              } else {
                placementRequested = true;
              }
            }

            // Moves the sketch toward (positive) or away from (negative) the viewer, in meters.
            function moveSketchDepthBy(meters) {
              placement.updateMatrixWorld(true);
              const cameraPosition = renderer.xr.getCamera(camera).getWorldPosition(new THREE.Vector3());
              const sketchPosition = overlay.getWorldPosition(new THREE.Vector3());
              const planeNormal = new THREE.Vector3(0, 0, 1).transformDirection(placement.matrixWorld);
              const nearDirection = planeNormal.dot(cameraPosition.sub(sketchPosition)) >= 0 ? 1 : -1;
              overlay.position.z += meters * nearDirection;
            }

            // Panel buttons: one press = 1 cm.
            function moveSketchDepth(direction) {
              moveSketchDepthBy(direction * depthStepPerPress);
            }

            renderer.xr.addEventListener("sessionstart", () => {
              document.body.classList.add("xr-active");
              xrHud.appendChild(sketchControls);
              if (cameraFeed.srcObject) {
                cameraFeed.srcObject.getTracks().forEach((track) => track.stop());
                cameraFeed.srcObject = null;
              }
              document.dispatchEvent(new Event("xr-camera-stop"));
              document.querySelector("#stage").classList.remove("is-live");
              flipButton.hidden = true;
              stopButton.hidden = true;
              statusText.textContent = xrSessionMode === "immersive-ar" ? "Headset AR live" : "VR emulator live";
              bottomNote.textContent = xrSessionMode === "immersive-ar" ? "Passthrough active" : "Test mode · no passthrough";
              errorMessage.textContent = "";
              isFixed = false;
              hasBeenPlaced = false;
              anchorGeneration += 1;
              placementRequested = false;
              placementAnchor = null;
              placement.matrix.identity();
              overlay.visible = true;
              overlay.position.set(0, 0, 0.012);
              setPanelHidden(false);
              hoveredXRControl = null;
              drawXRControlPanel();
              reticle.visible = false;
              overlay.position.z = 0.012;
              camera.add(xrControlPanel);
              xrControlPanel.position.set(0.2, -0.1, -0.58);
              xrControlPanel.rotation.set(0, 0, 0);
              xrPlacementHint.textContent = "Pull the trigger or press A to pin the sketch · push the thumbstick to move the panel";
              previousFrameTime = null;
              renderer.setAnimationLoop((time, frame) => {
                if (frame) {
                  const deltaSeconds = previousFrameTime === null
                    ? 0
                    : Math.min((time - previousFrameTime) / 1000, 0.05);
                  previousFrameTime = time;
                  const referenceSpace = renderer.xr.getReferenceSpace();
                  const viewerPose = frame.getViewerPose(referenceSpace);
                  // Aim like a laser pointer with a tracked controller; use the head only if none is held.
                  // The aiming controller is the one you last moved or pressed (default: the first one held).
                  const aimCandidates = controllerRecords.filter((record) => record.inputSource && isThumbstickController(record.inputSource));
                  for (const candidate of aimCandidates) {
                    if (!candidate.lastPosition) candidate.lastPosition = candidate.controller.position.clone();
                    if (candidate.controller.position.distanceTo(candidate.lastPosition) > 0.002) activeAimRecord = candidate;
                    candidate.lastPosition.copy(candidate.controller.position);
                  }
                  if (!aimCandidates.includes(activeAimRecord)) activeAimRecord = aimCandidates[0] || null;
                  const aimRecord = activeAimRecord;
                  let aimOrigin = null;
                  let aimDirection = null;
                  if (aimRecord) {
                    setControllerRay(aimRecord.controller);
                    aimOrigin = controllerPosition.clone();
                    aimDirection = controllerDirection.clone();
                    aimOffset.makeTranslation(0, 0, -aimDistance);
                    previewMatrix.copy(aimRecord.controller.matrixWorld).multiply(aimOffset);
                  } else if (viewerPose) {
                    headMatrix.fromArray(viewerPose.transform.matrix);
                    previewMatrix.copy(headMatrix).multiply(previewOffset);
                    headMatrix.decompose(viewerPosition, viewerQuaternion, viewerScale);
                    aimOrigin = viewerPosition.clone();
                    aimDirection = new THREE.Vector3(0, 0, -1).applyQuaternion(viewerQuaternion);
                  }
                  const targetMatrix = aimOrigin ? findSurfaceTarget(frame, referenceSpace, aimOrigin, aimDirection) : null;
                  const session = renderer.xr.getSession();
                  for (const inputSource of session.inputSources) {
                    if (!inputSource.gamepad) continue;
                    const record = controllerRecords.find((candidate) => candidate.inputSource === inputSource);
                    const pressed = inputSource.gamepad.buttons[triggerButtonIndex]?.pressed || false;
                    const wasPressed = previousButtonStates.get(inputSource) || false;
                    let control = null;
                    let panelHit = null;
                    let tabHit = null;
                    let helpTabHit = null;
                    if (record) {
                      setControllerRay(record.controller);
                      if (xrControlPanel.visible) {
                        panelHit = controllerRaycaster.intersectObject(xrControlPanel, false)[0] || null;
                        control = findXRControl(panelHit);
                      }
                      if (menuTab.visible) {
                        tabHit = controllerRaycaster.intersectObject(menuTab, false)[0] || null;
                      }
                      helpTabHit = controllerRaycaster.intersectObject(helpTab, false)[0] || null;
                      const nextHovered = control?.id || null;
                      if (nextHovered !== hoveredXRControl) {
                        hoveredXRControl = nextHovered;
                        drawXRControlPanel();
                      }
                      record.ray.material.color.set(control ? 0xd4f36a : 0xeef1e9);
                    }

                    if (pressed && !wasPressed && record) {
                      if (control) activateXRControl(control.id);
                      else if (tabHit) setPanelHidden(false);
                      else if (helpTabHit) helpCard.visible = !helpCard.visible;
                      else if (!isFixed && !panelHit) togglePlacement();
                    }
                    // A (right) or X (left) toggles: pins where you aim, or releases.
                    const faceDown = Boolean(inputSource.gamepad.buttons[faceButtonIndex]?.pressed);
                    const faceWasDown = previousFaceStates.get(inputSource) || false;
                    if (faceDown && !faceWasDown) togglePlacement();
                    previousFaceStates.set(inputSource, faceDown);

                    // B or Y shows or hides the menu.
                    const menuDown = Boolean(inputSource.gamepad.buttons[menuButtonIndex]?.pressed);
                    if (menuDown && !(previousMenuStates.get(inputSource) || false)) setPanelHidden(!panelHidden);
                    previousMenuStates.set(inputSource, menuDown);

                    // Grip on an empty part of the panel drags the panel.
                    const gripDown = Boolean(inputSource.gamepad.buttons[gripButtonIndex]?.pressed);
                    const gripWasDown = previousGripStates.get(inputSource) || false;
                    if (record && xrControlPanel.visible) {
                      if (gripDown && !gripWasDown && panelHit && !control && (!panelDrag || !panelDrag.record.inputSource)) {
                        startPanelDrag(record);
                      }
                      if (panelDrag && panelDrag.record === record) {
                        if (gripDown) updatePanelDrag();
                        else panelDrag = null;
                      }
                    }
                    previousGripStates.set(inputSource, gripDown);
                    if (record && (pressed || faceDown || gripDown)) activeAimRecord = record;
                    previousButtonStates.set(inputSource, pressed);
                  }

                  if (placementRequested && (!isFixed) && (targetMatrix || aimOrigin)) {
                    if (placementAnchor) placementAnchor.delete();
                    placementAnchor = null;
                    placement.matrix.copy(targetMatrix || previewMatrix);
                    placementRequested = false;
                    isFixed = true;
                    hasBeenPlaced = true;
                    hoveredXRControl = null;
                    xrPlacementHint.textContent = "Pinned · hold grip: stick left/right slides, up/down moves nearer/farther · A releases";
                    if (typeof frame.createAnchor === "function") {
                      const position = new THREE.Vector3();
                      const orientation = new THREE.Quaternion();
                      const scale = new THREE.Vector3();
                      placement.matrix.decompose(position, orientation, scale);
                      const transform = new XRRigidTransform(
                        { x: position.x, y: position.y, z: position.z },
                        { x: orientation.x, y: orientation.y, z: orientation.z, w: orientation.w }
                      );
                      const anchorId = ++anchorGeneration;
                      frame.createAnchor(transform, referenceSpace).then((anchor) => {
                        if (isFixed && anchorId === anchorGeneration) placementAnchor = anchor;
                        else anchor.delete();
                      }).catch(() => {});
                    }
                  }

                  if (placementAnchor && hasBeenPlaced) {
                    const anchorPose = frame.getPose(placementAnchor.anchorSpace, referenceSpace);
                    if (anchorPose) placement.matrix.fromArray(anchorPose.transform.matrix);
                  } else if (!isFixed && targetMatrix) {
                    placement.matrix.copy(targetMatrix);
                  } else if (!isFixed && aimOrigin) {
                    placement.matrix.copy(previewMatrix);
                  }

                  if (isFixed) {
                    // Grip held + stick: left/right slides, up/down moves nearer (up) or farther (down).
                    const movement = getJoystickInput(session);
                    if (movement.grip && (movement.x || movement.y)) {
                      overlay.position.x += movement.x * joystickMoveSpeed * deltaSeconds;
                      // Squared response: small pushes give fine steps, big pushes move faster.
                      const depthInput = Math.sign(movement.y) * movement.y * movement.y;
                      moveSketchDepthBy(-depthInput * depthSpeed * deltaSeconds);
                    }
                  } else {
                    // Not pinned: grip + stick up/down sets how far the sketch goes, otherwise the stick moves the menu.
                    const movement = getJoystickInput(session);
                    if (movement.grip) {
                      aimDistance = Math.max(0.2, Math.min(3, aimDistance + movement.y * aimDistanceSpeed * deltaSeconds));
                    } else if (movement.x || movement.y) {
                      moveFloatingPanel(movement, deltaSeconds);
                    }
                  }

                  const hasTarget = Boolean(targetMatrix);
                  overlay.visible = true;
                  reticle.visible = hasTarget && !isFixed;
                  if (!isFixed) {
                    xrPlacementHint.textContent = hasTarget
                      ? "Wall found · pull the trigger or press A to pin the sketch here"
                      : "No wall found · pull the trigger or press A to place it in front of you";
                  }
                }
                renderer.render(scene, camera);
              });
            });

            renderer.xr.addEventListener("sessionend", () => {
              renderer.setAnimationLoop(null);
              stage.appendChild(sketchControls);
              if (placementAnchor) placementAnchor.delete();
              placementAnchor = null;
              isFixed = false;
              hasBeenPlaced = false;
              anchorGeneration += 1;
              placementRequested = false;
              previousButtonStates.clear();
              previousFaceStates.clear();
              previousMenuStates.clear();
              previousGripStates.clear();
              panelDrag = null;
              document.body.classList.remove("xr-active");
              sketchSize.dispatchEvent(new Event("input", { bubbles: true }));
              statusText.textContent = "Camera off";
              bottomNote.textContent = "Waiting for camera";
            });

            xrButton.hidden = false;
            async function startXRSession() {
              if (xrButton.disabled) return;
              xrButton.disabled = true;
              errorMessage.textContent = "";
              let session = null;
              try {
                session = await navigator.xr.requestSession(xrSessionMode, {
                  optionalFeatures: ["plane-detection", "local-floor", "anchors"]
                });
                await renderer.xr.setSession(session);
              } catch (error) {
                if (session) await session.end();
                errorMessage.textContent = `WebXR startup failed (${error.name}): ${error.message || "Unknown error"}`;
              } finally {
                xrButton.disabled = false;
              }
            }

            xrButton.addEventListener("click", startXRSession);

          }
        } catch (error) {
          errorMessage.textContent = "Headset support didn't load. Check your connection and reload the page. The camera view still works.";
        }
      }
    </script>
    <script>
      // Register the service worker so the app can be installed and load offline.
      if ("serviceWorker" in navigator && window.isSecureContext) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
